<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUI Sign - Dashboard</title>
    <style>
        /* ============================================
           CSS STYLES - Can be moved to dashboard.css
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        /* Header Section */
        .header {
            background: linear-gradient(135deg, #c9a876 0%, #b8965f 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            clip-path: ellipse(100% 100% at 50% 0%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 30px;
            z-index: 2;
        }

        .logo img {
            height: 60px;
            width: auto;
        }

        .welcome-text {
            font-size: 1.8em;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Dashboard Container */
        .dashboard-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Menu Items */
        .menu-item {
            background: linear-gradient(135deg, #c9a876 0%, #b8965f 100%);
            border-radius: 12px;
            padding: 25px 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        .menu-item:hover::before {
            left: 100%;
        }

        .menu-item:hover {
            transform: translateX(10px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
        }

        .menu-item:active {
            transform: translateX(10px) scale(0.98);
        }

        /* Icon Styles */
        .menu-icon {
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
        }

        .menu-icon.blue-bg {
            background: #0ea5e9;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.8em;
            font-weight: bold;
        }

        /* Menu Text */
        .menu-text {
            color: white;
            font-size: 1.5em;
            font-weight: 600;
            letter-spacing: 0.5px;
            flex: 1;
        }

        /* Arrow Icon */
        .arrow-icon {
            color: white;
            font-size: 1.8em;
            opacity: 0.8;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 30px 20px;
            }

            .logo {
                top: 15px;
                left: 20px;
            }

            .logo img {
                height: 45px;
            }

            .welcome-text {
                font-size: 1.4em;
            }

            .dashboard-container {
                padding: 30px 15px;
            }

            .menu-item {
                padding: 20px 25px;
            }

            .menu-text {
                font-size: 1.3em;
            }

            .menu-icon {
                font-size: 2em;
            }

            .menu-icon.blue-bg {
                width: 45px;
                height: 45px;
                font-size: 1.5em;
            }
        }

        @media (max-width: 480px) {
            .logo {
                top: 10px;
                left: 15px;
            }

            .logo img {
                height: 35px;
            }

            .welcome-text {
                font-size: 1.2em;
            }

            .menu-item {
                padding: 18px 20px;
                gap: 15px;
            }

            .menu-text {
                font-size: 1.1em;
            }

            .menu-icon {
                font-size: 1.8em;
            }
        }

        /* Desktop styles */
        @media (min-width: 1024px) {
            .dashboard-container {
                max-width: 700px;
            }

            .header {
                padding: 50px 40px;
            }

            .logo {
                top: 25px;
                left: 40px;
            }

            .logo img {
                height: 75px;
            }

            .welcome-text {
                font-size: 2.2em;
            }

            .menu-item {
                padding: 30px 40px;
            }

            .menu-text {
                font-size: 1.6em;
            }
        }

        /* Loading Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-item {
            animation: fadeIn 0.5s ease forwards;
        }

        .menu-item:nth-child(1) { animation-delay: 0.1s; }
        .menu-item:nth-child(2) { animation-delay: 0.2s; }
        .menu-item:nth-child(3) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <!-- ============================================
         HTML STRUCTURE
         ============================================ -->
    
    <div class="header">
        <div class="logo">
            <img src="download-removebg-preview.png" alt="AUI SIGN Logo">
        </div>
        <h1 class="welcome-text">Welcome Amarachi</h1>
    </div>

    <div class="dashboard-container">
        <!-- Sign Attendance Button -->
        <div class="menu-item" onclick="navigateTo('sign-attendance')">
            <div class="menu-icon">📝</div>
            <div class="menu-text">Sign Attendance</div>
            <div class="arrow-icon">→</div>
        </div>

        <!-- About the App Button -->
        <div class="menu-item" onclick="navigateTo('about')">
            <div class="menu-icon blue-bg">i</div>
            <div class="menu-text">About the App</div>
            <div class="arrow-icon">→</div>
        </div>

        <!-- Log out Button -->
        <div class="menu-item" onclick="navigateTo('logout')">
            <div class="menu-icon">🚪</div>
            <div class="menu-text">Log out</div>
            <div class="arrow-icon">→</div>
        </div>
    </div>

    <!-- ============================================
         JAVASCRIPT - Can be moved to dashboard.js
         ============================================ -->
    
    <script>
        // Navigation function
        function navigateTo(page) {
            const menuItems = document.querySelectorAll('.menu-item');
            
            // Add click feedback
            event.currentTarget.style.transform = 'translateX(10px) scale(0.95)';
            
            setTimeout(() => {
                switch(page) {
                    case 'sign-attendance':
                        console.log('Navigating to Sign Attendance page');
                        alert('Navigating to Sign Attendance page');
                        window.location.href = 'Sign in page.html';
                        break;
                    
                    case 'about':
                        console.log('Navigating to About page');
                        alert('Navigating to About the App page');
                        window.location.href = 'About.html';
                        break;
                    
                    case 'logout':
                        if (confirm('Are you sure you want to log out?')) {
                            console.log('Logging out...');
                            alert('Logged out successfully!');
                            window.location.href = 'index.html';
                        }
                        break;
                }
                
                // Reset transform
                event.currentTarget.style.transform = '';
            }, 200);
        }

        // Add ripple effect on click
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.3)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.6s ease-out';
                
                this.appendChild(ripple);
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(2);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Get user name from session/local storage (example)
        window.addEventListener('load', () => {
            const userName = localStorage.getItem('userName') || 'Student';
            document.querySelector('.welcome-text').textContent = `Welcome ${userName}`;
        });
    </script>
</body>
</html>
